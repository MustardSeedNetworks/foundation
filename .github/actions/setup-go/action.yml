name: 'Setup Go'
description: 'Set up Go from go.mod with dependency caching'
inputs:
  go-version-file:
    description: 'Path to go.mod file'
    required: false
    default: 'go.mod'
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
