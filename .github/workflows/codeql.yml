# =============================================================================
# CodeQL analysis
# =============================================================================
# foundation had no CodeQL at all, and default setup is `not-configured`. That
# left the module holding the Ed25519 licence verification and the per-session
# CSRF token manager -- the two pieces of security-critical code four repos
# depend on -- with no semantic security analysis, only golangci-lint's gosec.
#
# Go only. There is no JS/TS here, and listing a language with no source makes
# the analysis fail rather than skip.
# =============================================================================

name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC

permissions:
  contents: read

jobs:
  analyze:
    # Matches the fleet: CodeQL on private repos needs Advanced Security, which
    # the org's plan does not carry. foundation is public, so this runs.
    if: ${{ github.event.repository.visibility == 'public' }}
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: go
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      # Analysis still runs and still fails the job. The upload does not, on
      # merge_group: the queue ref can be deleted before code scanning
      # accepts the SARIF, which fails the job with "ref not found".
      # 'never' is truthy, so the &&/|| pair selects it on that event and
      # 'always' otherwise.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:go"
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
