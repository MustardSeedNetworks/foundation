# Documentation link check.
#
# Scheduled, not per-PR (the pattern shared with seed/stem/niac/trellis):
# walking every external URL in every .md file is slow and its failures are
# caused by third-party links rotting, not by the change under review.
# Running it per-PR therefore means either red PRs for unrelated reasons or
# a check nobody trusts.
#
# On a schedule it can be blocking: a failure here is a real, actionable repo
# defect rather than PR noise.
name: Docs Link Check

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: Check markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.17
        with:
          use-quiet-mode: "yes"
          config-file: ".github/markdown-link-check.json"
