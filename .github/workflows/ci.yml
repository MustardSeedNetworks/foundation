name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # pkg/corewlan's CoreWLAN binding is behind //go:build darwin, so the job
  # above only ever compiles the !darwin stub — a break in the cgo/Objective-C
  # path would still show a green check. This job builds the real thing.
  build-test-darwin:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go build ./...
      - run: go vet ./...
      # Linking, not just compiling, is what proves the -framework LDFLAGS
      # resolve: `go build` of a library package stops after the ObjC compile.
      # The external corewlan_test package pulls the darwin implementation into
      # a linked test binary, so this covers both. The tests are pure decoding,
      # so the runner needs no Wi-Fi adapter and no Location Services grant.
      - run: go test -race ./...
      # macos-latest is arm64; products importing foundation still ship a
      # darwin/amd64 slice. Xcode carries both, so link that one too.
      - name: Link darwin/amd64
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
        run: go test -c -o /dev/null ./pkg/corewlan

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
