# =============================================================================
# Release Please - Automated Version Management
# =============================================================================
# foundation's tags were cut by hand until now. That is a worse problem here
# than in the products: four repos pin this module (all on v0.5.2 today), so a
# release that never happens is a security fix that never reaches them, and a
# hand-cut tag is a version nobody can reconstruct from the commit history.
#
# Trigger pattern is the fleet's (seed/stem/niac):
#   - workflow_run on CI completion: real trigger; gated on success
#   - schedule: reconciles a release that a flaky CI run skipped
#   - workflow_dispatch: manual debug / force trigger
#
# The schedule is not belt-and-braces. The workflow_run gate means a TRANSIENT
# CI failure on main does not merely go red, it skips the release outright and
# says nothing -- a merged release PR, no tag, and a workflow that "succeeded"
# by skipping. release-please is idempotent, so a periodic run is free of false
# positives and the skipped release self-heals within the interval.
#
# Unlike the products there is no release.yml here: this module ships no
# binaries and no packages. The tag IS the release -- consumers resolve it with
# `go get`. That also means the App-token requirement is softer here than in
# seed, where a GITHUB_TOKEN tag would fail to trigger the package build. It is
# used anyway, for one reason that does apply: an App-authored release PR gets
# CI, and a GITHUB_TOKEN-authored one does not.
# =============================================================================

name: Release Please

on:
  # zizmor: ignore[dangerous-triggers]
  # workflow_run is required here: release-please must run after CI succeeds on
  # main, with write access, which pull_request cannot give. The usual
  # workflow_run hazard is checking out the triggering run's untrusted head --
  # this workflow performs no checkout at all, and is gated on branches:[main]
  # plus conclusion == 'success'.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Offset from the hour and from the four product repos, so the fleet's
  # release runs do not all fire together.
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

# All three triggers can fire close together, and two overlapping runs both
# force-update heads/release-please--branches--main: one wins, the other dies
# with "Error updating ref", which is a red build for a race rather than a
# problem. cancel-in-progress is false on purpose -- cancelling mid-release is
# worse than queueing behind it, and release-please is idempotent.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    # Only run if CI succeeded -- or if this is the reconciling schedule or a
    # manual dispatch, neither of which carries a workflow_run to gate on.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scoped to what release-please needs: write the changelog/tag/release
          # (contents) and open, update and label the release PR
          # (pull-requests). Without these the token inherits every permission
          # the msn-ci-bot installation holds.
          #
          # Do NOT add permission-issues: the installation does not grant it and
          # create-github-app-token hard-fails on a permission the installation
          # lacks -- that broke every release across the fleet once already.
          # Labels on a pull request are covered by pull-requests: write.
          permission-contents: write
          permission-pull-requests: write
          # release-please creates the release branch and the version tag. When
          # a workflow file has changed since the last release those refs carry
          # a .github/workflows/** diff and GitHub refuses the ref write without
          # this scope -- every release stalled fleet-wide until it was added.
          permission-workflows: write

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # NOTE: do NOT pass release-type here. It is declared per-package in
          # release-please-config.json (release-type: go). Passing it as a
          # direct action input forces a mode that ignores the config file's
          # per-package options -- including bump-minor-pre-major -- which made
          # release-please propose a 1.0.0 major bump off a pre-1.0 breaking
          # change in seed (#1602). We are pre-alpha and stay on 0.x.
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # release-please only started opening these here (#19), so there is no
      # backlog yet -- which is the moment to make sure one never forms. Nothing about merging it is
      # a judgement call -- release-please generates the changelog and the
      # version bump from the commits already on main, and CI Complete still
      # has to go green before the queue takes it. Arming auto-merge makes a
      # release land on its own within one schedule tick.
      #
      # Not the same as merging blind: auto-merge waits for every required
      # check exactly as a human clicking merge would. What it removes is the
      # clicking, which is the part that was silently not happening.
      #
      # To hold a release deliberately, label the PR `release: hold` -- this
      # step then leaves it alone and it stays a manual merge.
      #
      # `--squash` is required here, unlike the product repos: those run a
      # merge queue which owns the strategy and refuses `--auto --squash`,
      # while foundation has no queue, so GitHub needs the method naming.
      # This job performs no checkout (see the workflow_run note at the top), so
      # gh has no repository to infer: without --repo both calls died with
      # "failed to run git: fatal: not a git repository" on every scheduled
      # tick after this step landed, and the job went red fleet-wide.
      - name: Arm auto-merge on the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # `.[0] | select(...)` looked right and failed on the common case:
          # with no open release PR, `.[0]` is null and `.labels` on null is a
          # jq error, which under `set -e` would redden release-please on
          # every quiet tick. Filter the array, then take the first.
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head release-please--branches--main --state open \
                  --json number,labels \
                  --jq '[.[] | select((.labels | map(.name) | index("release: hold")) | not) | .number] | first // empty')"
          if [ -z "${pr}" ]; then
            echo "No open release PR to arm, or it carries release: hold."
            exit 0
          fi
          echo "Arming auto-merge on #${pr}"
          # Already queued is the steady state on the second and later ticks,
          # and is not a failure.
          gh pr merge --repo "${GITHUB_REPOSITORY}" "${pr}" --auto --squash 2>&1 | tee /tmp/arm.log || {
            grep -q "already queued to merge" /tmp/arm.log || exit 1
          }

      - name: Output release info
        if: steps.release.outputs.release_created
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Released ${TAG_NAME} (${VERSION})"
          echo "Consumers pin this module by tag; bump them with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "go get github.com/MustardSeedNetworks/foundation@${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
