info:
    contact:
        name: Mustard Seed Networks
        url: https://github.com/MustardSeedNetworks/niac-go
    description: |
        Network In A Can — Go Edition REST API.

        Programmatic access to network simulation sessions, device
        configuration, the content library, SNMP walk tooling and PCAP
        capture/replay.

        ## Authentication
        Every route below `/api/v1` and `/metrics` requires a bearer token
        (`NIAC_API_TOKEN` or a token file). `/__version` and `/__capabilities`
        are deliberately unauthenticated deployment introspection. The installed
        loopback-only daemon additionally permits tokenless local access, which
        OpenAPI 3.0 cannot express per server and so is documented here rather
        than in a security requirement.

        ## CSRF protection
        Operations marked with the `CsrfToken` security scheme need a token from
        `GET /api/v1/csrf-token` in the `X-CSRF-Token` header. Tokens are
        per-session, keyed by the bearer that fetched them.

        ## Rate limiting
        Routes marked rate limited answer 429 once their per-IP budget is spent.
        Budgets differ by class (write, walk, upload, file listing).
